<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Legend of Aria — Model Viewer</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #14161c; color: #e8e8e8; font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
      #app { display: grid; grid-template-columns: 240px 1fr; height: 100%; }
      #side { background: #1d2028; border-right: 1px solid #2c303a; display: flex; flex-direction: column; min-height: 0; }
      #side h1 { font-size: 13px; margin: 0; padding: 12px 14px; letter-spacing: .08em; text-transform: uppercase; color: #9aa4b8; border-bottom: 1px solid #2c303a; }
      #search { margin: 10px 12px 6px; padding: 6px 8px; background: #14161c; border: 1px solid #2c303a; color: #e8e8e8; border-radius: 4px; width: calc(100% - 24px); }
      #list { overflow-y: auto; flex: 1; padding: 4px 0 12px; }
      #list .cat { padding: 10px 14px 4px; font-size: 11px; color: #7f8aa0; text-transform: uppercase; letter-spacing: .08em; }
      #list button { display: block; width: 100%; text-align: left; padding: 5px 14px; background: none; border: 0; color: #d6dae3; cursor: pointer; font: inherit; }
      #list button:hover { background: #262a35; }
      #list button.active { background: #2e6ad1; color: #fff; }
      #main { position: relative; min-width: 0; }
      #stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #14161c; }
      canvas { display: block; image-rendering: pixelated; }
      #bar { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; pointer-events: none; }
      #bar > * { pointer-events: auto; }
      .seg { display: inline-flex; background: #1d2028; border: 1px solid #2c303a; border-radius: 6px; overflow: hidden; }
      .seg button { background: none; border: 0; color: #d6dae3; padding: 6px 12px; cursor: pointer; font: inherit; }
      .seg button.active { background: #2e6ad1; color: #fff; }
      .chip { background: #1d2028; border: 1px solid #2c303a; border-radius: 6px; padding: 5px 10px; display: inline-flex; gap: 8px; align-items: center; }
      .chip input[type=range] { width: 90px; }
      #help { position: absolute; bottom: 10px; left: 10px; color: #7f8aa0; font-size: 12px; }
      #name { position: absolute; bottom: 10px; right: 12px; color: #9aa4b8; font-size: 12px; }
      label { user-select: none; cursor: pointer; }
    </style>
  </head>
  <body>
    <div id="app">
      <aside id="side">
        <h1>Model Viewer</h1>
        <input id="search" placeholder="Filter…" />
        <div id="list"></div>
      </aside>
      <div id="main">
        <div id="stage"><canvas id="c"></canvas></div>
        <div id="bar">
          <div class="seg" id="mode"><button data-m="game" class="active">Game view</button><button data-m="free">Free view</button></div>
          <div class="seg" id="facing"><button data-f="0" class="active">↓ S</button><button data-f="1">→ E</button><button data-f="2">↑ N</button><button data-f="3">← W</button></div>
          <div class="chip"><label><input type="checkbox" id="anim" checked /> Walk</label></div>
          <div class="chip"><label><input type="checkbox" id="post" checked /> Pixel post-FX</label></div>
          <div class="chip"><label><input type="checkbox" id="grid" checked /> Ground</label></div>
          <div class="chip">Zoom <input type="range" id="zoom" min="1" max="6" step="1" value="3" /><span id="zoomv">3×</span></div>
        </div>
        <div id="help"></div>
        <div id="name"></div>
      </div>
    </div>
    <script type="module" src="/src/viewer/main.ts"></script>
  </body>
</html>
